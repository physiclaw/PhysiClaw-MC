# PCW-MC-01 running stock FluidNC v4.1.1, classic ESP32 WROOM, 4 MB.
# Both CoreXY motors request 0.800 A RMS per phase with a regulated 12 V / 3 A adapter.
# Verify motor direction and travel on the assembled machine. Solenoid is 12 V / 0.8 A.
# Programming and first-article tests are described in manufacturing/process.md.
name: PCW-MC-01
board: PCW-MC-01

kinematics:
  CoreXY:
    x_scaler: 1.0

stepping:
  engine: RMT
  idle_ms: 500
  pulse_us: 4
  dir_delay_us: 1
  disable_delay_us: 0

start:
  must_home: false
  check_limits: false

# GPIO27 releases U9 and U12 after startup with the solenoid off and motors disabled.
user_outputs:
  digital0_pin: gpio.27

macros:
  after_reset: "M5&$MD&M64 P0"
  macro0: "M5&$MD&M64 P0"
  macro1: "M65 P0&M5&$MD"

# Discrete state indicators, active high. Neither is a heartbeat/watchdog.
status_outputs:
  report_interval_ms: 250
  idle_pin: gpio.18
  alarm_pin: gpio.19

uart1:
  txd_pin: gpio.17
  rxd_pin: gpio.16
  rts_pin: NO_PIN
  cts_pin: NO_PIN
  baud: 115200
  mode: 8N1

axes:
  # Active-high disable command passes U9 only when GPIO27 ARM is HIGH.
  # Physical ENN has a pull-up, holding both drivers disabled while unarmed.
  # idle_ms releases both motors after 500 ms; no indefinite holding torque.
  shared_stepper_disable_pin: gpio.13:high
  # J3 (X MOTOR) drives right motor B on the upper belt (X + Y).
  x:
    steps_per_mm: 80.0
    max_rate_mm_per_min: 10000.0
    acceleration_mm_per_sec2: 1000.0
    max_travel_mm: 110.0
    soft_limits: false
    motor0:
      tmc_2209:
        uart_num: 1
        addr: 0
        r_sense_ohms: 0.100
        run_amps: 0.800
        hold_amps: 0.150
        microsteps: 16
        run_mode: StealthChop
        use_enable: false
        step_pin: gpio.25
        direction_pin: gpio.26
  # J4 (Y MOTOR) drives left motor A on the lower belt (X - Y).
  y:
    steps_per_mm: 80.0
    max_rate_mm_per_min: 10000.0
    acceleration_mm_per_sec2: 1000.0
    max_travel_mm: 200.0
    soft_limits: false
    motor0:
      tmc_2209:
        uart_num: 1
        addr: 1
        r_sense_ohms: 0.100
        run_amps: 0.800
        hold_amps: 0.150
        microsteps: 16
        run_mode: StealthChop
        use_enable: false
        step_pin: gpio.21
        direction_pin: gpio.22

# Solenoid PWM: S0..1000 commands 0..100% duty; M5 switches OFF.
# Duty is not a measured/regulated current in amperes.
# Qualify 1 kHz with the intended switch, coil and harness.
# Pulse duration/rest are user-controlled; there is no automatic timing rule.
# Keep spindle override at 100% when interpreting S as duty percentage.
# M3/M5 synchronize with queued motion; feed-hold is not solenoid OFF.
# Do not use Z moves: FluidNC creates an unconnected virtual Z automatically.
PWM:
  pwm_hz: 1000
  output_pin: gpio.32
  enable_pin: NO_PIN
  direction_pin: NO_PIN
  tool_num: 0
  speed_map: 0=0% 1000=100%
  s0_with_disable: true
  disable_with_s0: true
  off_on_alarm: true

# No endstop, probe, SD or display is fitted. GPIO34 is unused.
